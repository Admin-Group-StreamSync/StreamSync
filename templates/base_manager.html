<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StreamSync Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            /* Paleta original del Manager */
            --ss-darkest:  #0D1321;
            --ss-dark:     #1D2D44;
            --ss-mid:      #3E5C76;
            --ss-light:    #748CAB;
            --ss-cream:    #F0EBD8;

            /* Mapatge automàtic de les variables de la teva capçalera preferida */
            --highlight:    var(--ss-cream);
            --accent:       var(--ss-light);
            --bg-surface:   rgba(62, 92, 118, 0.35);
            --bg-card:      var(--ss-dark);
            --bg-elevated:  #253d58;
            --border-color: rgba(116, 140, 171, 0.2);

            /* ── Variables que usa card_contingut.html ── */
            --deep-black:     #0D1321;
            --navy:           #1D2D44;
            --steel:          #3E5C76;
            --slate:          #748CAB;
            --cream:          #F0EBD8;
            --text-muted:     #5e7a96;
            --text-secondary: #9aafc4;
            --primary-gradient: linear-gradient(90deg, #3E5C76, #748CAB);
        }

        body {
            background-color: var(--ss-darkest);
            color: var(--ss-cream);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* ── Estils importats i adaptats de la teva capçalera ── */
        .navbar-brand {
            transition: transform 0.3s ease;
        }
        .navbar-brand:hover {
            transform: scale(1.03);
        }
        .navbar-brand i {
            display: inline-block;
            transition: transform 0.4s ease, color 0.3s ease;
            color: var(--accent);
        }
        .navbar-brand:hover i {
            animation: clapper-action 0.6s ease;
            color: var(--highlight);
        }
        @keyframes clapper-action {
            0%   { transform: rotate(0deg); }
            30%  { transform: rotate(-15deg); }
            60%  { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        /* Estil de botó de l'usuari (Manager) */
        .btn-nav-user {
            background: var(--bg-surface);
            border: 1px solid var(--accent);
            color: var(--highlight) !important;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-nav-user:hover, .btn-nav-user[aria-expanded="true"] {
            transform: scale(1.05);
            border-color: var(--highlight);
            color: var(--highlight) !important;
            box-shadow: 0 5px 20px rgba(116, 140, 171, 0.25);
        }

        /* Elements del menú desplegable (Dropdown) */
        .dropdown-menu {
            background-color: var(--ss-dark);
            border: 1px solid var(--ss-mid) !important;
        }
        .dropdown-header {
            color: var(--ss-light);
        }
        .dropdown-divider {
            border-color: var(--ss-mid);
        }
        .dropdown-item {
            color: var(--ss-cream);
        }
        .dropdown-item:hover {
            background-color: var(--ss-mid);
            color: var(--ss-cream);
        }
        .dropdown-item.text-danger {
            color: #e07070 !important;
        }
        .dropdown-item.text-danger:hover {
            background-color: rgba(224, 112, 112, 0.15);
            color: #e07070 !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark py-3 shadow-sm sticky-top"
         style="background: var(--bg-card); border-bottom: 1px solid var(--border-color);">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-between w-100">

                <div class="flex-grow-1" style="flex-basis: 0;">
                    <a class="navbar-brand fw-bold d-flex align-items-center fs-4 m-0 text-decoration-none"
                       href="{% url 'dashboard_manager' request.user.profile.manager_de %}" style="color: var(--highlight);">
                        <i class="bi bi-clapperboard-fill me-2 fs-3"></i>
                        <span style="letter-spacing: -0.5px;">StreamSync</span>
                    </a>
                </div>

                <div class="flex-grow-1 d-none d-lg-flex justify-content-center" style="flex-basis: 0;"></div>

                <div class="flex-grow-1 d-flex justify-content-end align-items-center" style="flex-basis: 0;">
                    <div class="dropdown">
                        <button class="btn-nav-user dropdown-toggle border-0" type="button" id="profileMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            {% if request.user.last_name|slice:":15" == "images/avatars/" %}
                                <img src="/{{ request.user.last_name }}" alt="Avatar" class="rounded-circle" style="width: 24px; height: 24px; object-fit: cover;"
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                                <i class="bi bi-person-circle" style="display:none;"></i>
                            {% else %}
                                <i class="bi bi-person-circle"></i>
                            {% endif %}
                            <span>Manager</span>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm rounded-3 mt-2" aria-labelledby="profileMenu">
                            <li><h6 class="dropdown-header">{{ request.user.username }} ({{ request.user.profile.manager_de }})</h6></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form action="{% url 'logout' %}" method="post" class="px-2">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item text-danger rounded fw-bold">
                                        <i class="bi bi-box-arrow-right me-2"></i> Sign Out
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
